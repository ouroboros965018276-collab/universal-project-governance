name: rc7-refreeze

on:
  push:
    branches: [rc7-real-world-test-freeze]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rc7-real-world-test-freeze
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Compile current RC7 runtime
        run: python compiler/compile_governance.py --write --confirm-generated-runtime-update
      - name: Validate current source before freeze
        run: |
          python tools/governance_lint.py .
          python tools/validate_qualification.py .
      - name: Regenerate final real-agent freeze identity
        run: python tools/qualification_freeze.py . --write --confirm-freeze
      - name: Commit generated runtime and freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-project-governance qualification/FREEZE.json
          if git diff --cached --quiet; then
            echo "Generated runtime and freeze already current."
          else
            git commit -m "build: regenerate final RC7 runtime and freeze identity"
            git push origin HEAD:rc7-real-world-test-freeze
          fi
