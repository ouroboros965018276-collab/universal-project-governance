name: rc4-generate-runtime

on:
  push:
    branches: [rc4-compiled-governance]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rc4-compiled-governance
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Compile canonical governance source
        run: python compiler/compile_governance.py --write --confirm-generated-runtime-update
      - name: Static governance lint
        run: python tools/governance_lint.py .
      - name: Verify generated runtime integrity
        run: python universal-project-governance/scripts/validate_integrity.py universal-project-governance
      - name: Commit generated runtime when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A universal-project-governance
          if git diff --cached --quiet; then
            echo "Generated runtime already current."
          else
            git commit -m "build: compile RC4 installable runtime"
            git push origin HEAD:rc4-compiled-governance
          fi
      - name: Upload compiled runtime
        uses: actions/upload-artifact@v4
        with:
          name: rc4-compiled-runtime
          path: universal-project-governance/
          if-no-files-found: error
