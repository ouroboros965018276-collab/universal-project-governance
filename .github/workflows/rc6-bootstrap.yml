name: rc6-bootstrap

on:
  push:
    branches: [rc6-structural-qualification]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rc6-structural-qualification
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Compile generated RC6 runtime
        run: python compiler/compile_governance.py --write --confirm-generated-runtime-update
      - name: Validate canonical governance
        run: python tools/governance_lint.py .
      - name: Validate qualification v2 before freeze
        run: python tools/validate_qualification.py .
      - name: Generate RC6 qualification freeze
        run: python tools/qualification_freeze.py . --write --confirm-freeze
      - name: Commit generated runtime and freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-project-governance qualification/FREEZE.json
          if git diff --cached --quiet; then
            echo "Generated RC6 artifacts are already current."
          else
            git commit -m "build: compile RC6 runtime and freeze qualification identity"
            git push origin HEAD:rc6-structural-qualification
          fi
