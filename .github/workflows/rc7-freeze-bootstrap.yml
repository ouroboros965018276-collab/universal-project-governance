name: rc7-freeze-bootstrap

on:
  push:
    branches: [rc7-real-agent-freeze]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: rc7-freeze-bootstrap
  cancel-in-progress: true

jobs:
  generate-and-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rc7-real-agent-freeze
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Compile RC7 generated runtime
        run: python compiler/compile_governance.py --write --confirm-generated-runtime-update
      - name: Validate canonical model and qualification before freeze
        run: |
          python tools/governance_lint.py .
          python tools/validate_qualification.py .
          python tools/validate_skill_bundle.py universal-project-governance
          python universal-project-governance/scripts/validate_integrity.py universal-project-governance
      - name: Generate RC7 real-agent test freeze
        run: python tools/qualification_freeze.py . --write --confirm-freeze
      - name: Run full deterministic test suite on generated candidate
        run: |
          python tools/qualification_freeze.py . --check
          python tools/validate_repository.py .
          python tools/security_audit.py .
          python -m unittest discover -s tests -v
          python tools/package_release.py universal-project-governance --output-dir /tmp/upg-dist
      - name: Commit generated runtime and freeze only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-project-governance qualification/FREEZE.json
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(universal-project-governance/|qualification/FREEZE\.json$)' || true)"
          test -z "$unexpected"
          git commit -m "build: compile and freeze RC7 real-agent test candidate"
          git push origin HEAD:rc7-real-agent-freeze
