name: validate-pre-release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: validate-pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-runtime:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Windows runtime, portable freeze, and deterministic packaging
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python compiler/compile_governance.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/qualification_freeze.py . --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_release.py universal-project-governance --output-dir "$env:RUNNER_TEMP/upg-dist"

  source-runtime-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify canonical source compiles exactly to runtime
        run: python compiler/compile_governance.py --check
      - name: Enforce bounded governance and task-scope invariants
        run: python tools/governance_lint.py .
      - name: Validate qualification v3 contract
        run: python tools/validate_qualification.py .
      - name: Validate real-agent test freeze
        run: python tools/qualification_freeze.py . --check
      - name: Validate current repository contract
        run: python tools/validate_repository.py .
      - name: Validate compiled Skill bundle
        run: python tools/validate_skill_bundle.py universal-project-governance
      - name: Validate runtime integrity
        run: python universal-project-governance/scripts/validate_integrity.py universal-project-governance
      - name: Static security audit
        run: python tools/security_audit.py .

  runtime-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8','3.11','3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run compiled-runtime and qualification-contract tests
        run: python -m unittest discover -s tests -v
      - name: Reconfirm compiler and deterministic package
        run: |
          python compiler/compile_governance.py --check
          python tools/package_release.py universal-project-governance --output-dir /tmp/upg-dist

  qualification-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate hierarchical protocol, scope contracts, deployment, and freeze
        run: |
          python tools/validate_qualification.py .
          python tools/qualification_freeze.py . --check
      - name: Build multilingual trigger suite
        run: |
          python qualification/trigger_suite.py --output /tmp/trigger-suite.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/trigger-suite.json'))
          assert len(data['cases']) >= 100
          print('Metamorphic trigger cases:', len(data['cases']))
          PY
      - name: Verify known-bad mutant remains valid but behaviorally distinct
        run: |
          python qualification/mutations/build_mutant_runtime.py --mutant M01_DISABLE_SAFE_DELETE --output /tmp/upg-mutant
          python /tmp/upg-mutant/scripts/validate_integrity.py /tmp/upg-mutant
          python - <<'PY'
          import pathlib,sys
          sys.path.insert(0,'.')
          from tools.qualification_freeze import behavioral_fingerprint
          original=behavioral_fingerprint(pathlib.Path('universal-project-governance'))
          mutant=behavioral_fingerprint(pathlib.Path('/tmp/upg-mutant'))
          assert original != mutant
          print('Mutant behavioral fingerprint differs as expected.')
          PY

  upstream-agent-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned Agent Skills reference validator
        run: python -m pip install --disable-pip-version-check skills-ref==0.1.1
      - name: Validate compiled Agent Skill
        run: |
          python - <<'PY'
          from pathlib import Path
          from skills_ref import validate
          errors = validate(Path('universal-project-governance'))
          if errors:
              raise SystemExit('\n'.join(map(str, errors)))
          print('Upstream Agent Skills validation passed.')
          PY

  skills-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Discover compiled Skill
        env:
          DISABLE_TELEMETRY: '1'
        run: npx -y skills@1.7.0 add ./universal-project-governance --list
      - name: Verify one-command project install, binding, export, and remove
        env:
          DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          python upg.py install --project "$work" --agent codex --field-test-reporting --source "$GITHUB_WORKSPACE"
          test -f "$work/.governance/upg.json"
          test -f "$work/.governance/field-reports.json"
          python upg.py status --project "$work"
          echo '{"project_owned":true}' > "$work/.governance/project-owned.json"
          python upg.py export --project "$work" --output "$work/upg-field-test-export.json"
          python upg.py remove --project "$work" --agent codex --yes
          test ! -e "$work/.governance/upg.json"
          test ! -e "$work/.governance/field-reports.json"
          test -f "$work/.governance/project-owned.json"
      - name: Install compiled Skill into clean Codex target
        env:
          DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          npx -y skills@1.7.0 add "$GITHUB_WORKSPACE/universal-project-governance" --skill universal-project-governance -a codex --copy -y
          skill="$(find . -path '*/universal-project-governance/SKILL.md' -type f -print -quit)"
          test -n "$skill"
          python "$GITHUB_WORKSPACE/universal-project-governance/scripts/validate_integrity.py" "$(dirname "$skill")"
      - name: Install from private GitHub default branch
        if: github.ref == 'refs/heads/main'
        env:
          DISABLE_TELEMETRY: '1'
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          npx -y skills@1.7.0 add "${{ github.repository }}" --skill universal-project-governance -a codex --copy -y
          skill="$(find . -path '*/universal-project-governance/SKILL.md' -type f -print -quit)"
          test -n "$skill"
          python "$GITHUB_WORKSPACE/universal-project-governance/scripts/validate_integrity.py" "$(dirname "$skill")"
